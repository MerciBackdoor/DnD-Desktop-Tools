<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D&D Рабочий стол</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #0a0b0d;
      --panel:     #12141a;
      --surface:   #1c1f28;
      --border:    #2a2e3a;
      --accent:    #c0392b;
      --accent2:   #e67e22;
      --gold:      #c9a84c;
      --text:      #d4c9b0;
      --text-dim:  #6b6655;
      --glow:      rgba(192, 57, 43, 0.35);
      --titlebar-h: 36px;
      --taskbar-h:  50px;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg);
      font-family: 'Cormorant Garamond', serif;
      color: var(--text);
      cursor: default;
      user-select: none;
    }

    /* ══════════════════════════════════════
       DESKTOP BACKGROUND
    ══════════════════════════════════════ */
    #desktop {
      position: absolute;
      inset: 0 0 var(--taskbar-h) 0;
      overflow: hidden;
    }

    #desktop::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 15% 20%, rgba(192,57,43,0.06) 0%, transparent 60%),
        radial-gradient(ellipse 60% 80% at 85% 75%, rgba(201,168,76,0.04) 0%, transparent 60%),
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 39px,
          rgba(255,255,255,0.013) 39px,
          rgba(255,255,255,0.013) 40px
        ),
        repeating-linear-gradient(
          90deg,
          transparent,
          transparent 39px,
          rgba(255,255,255,0.013) 39px,
          rgba(255,255,255,0.013) 40px
        );
      pointer-events: none;
      z-index: 0;
    }

    /* ══════════════════════════════════════
       WINDOWS
    ══════════════════════════════════════ */
    .app-window {
      position: absolute;
      display: flex;
      flex-direction: column;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.03) inset;
      min-width: 360px;
      min-height: 240px;
      transition: box-shadow 0.15s;
      will-change: transform;
    }

    .app-window.focused {
      border-color: rgba(192,57,43,0.5);
      box-shadow:
        0 16px 50px rgba(0,0,0,0.8),
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 0 30px var(--glow);
    }

    .app-window.minimized { display: none; }

    /* Title bar */
    .win-titlebar {
      height: var(--titlebar-h);
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-radius: 5px 5px 0 0;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 10px;
      cursor: move;
      flex-shrink: 0;
    }

    .win-dots {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
    }

    .win-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .win-dot:hover { filter: brightness(1.35); transform: scale(1.15); }
    .win-dot.close    { background: #e74c3c; }
    .win-dot.minimize { background: #f39c12; }
    .win-dot.maximize { background: #2ecc71; }

    .win-title {
      flex: 1;
      text-align: center;
      font-family: 'Cinzel', serif;
      font-size: 0.75em;
      letter-spacing: 1.5px;
      color: var(--text-dim);
      pointer-events: none;
      text-transform: uppercase;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .app-window.focused .win-title { color: var(--text); }

    /* Body / iframe */
    .win-body {
      flex: 1;
      position: relative;
      overflow: hidden;
      border-radius: 0 0 5px 5px;
    }

    .win-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Iframe overlay (prevents mouse events during drag/resize) */
    .win-shield {
      position: absolute;
      inset: 0;
      z-index: 5000;
      display: none;
    }

    /* Resize handle */
    .win-resize {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 18px;
      height: 18px;
      cursor: se-resize;
      z-index: 10;
    }

    .win-resize::after {
      content: '';
      position: absolute;
      bottom: 4px;
      right: 4px;
      width: 8px;
      height: 8px;
      border-right: 2px solid var(--text-dim);
      border-bottom: 2px solid var(--text-dim);
      transition: border-color 0.15s;
    }

    .win-resize:hover::after { border-color: var(--gold); }

    /* ══════════════════════════════════════
       TASKBAR
    ══════════════════════════════════════ */
    #taskbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--taskbar-h);
      background: rgba(12, 14, 18, 0.95);
      border-top: 1px solid var(--border);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 6px;
      z-index: 9999;
    }

    #taskbar::before {
      content: '⚔';
      font-size: 1.4em;
      color: var(--accent);
      margin-right: 8px;
      text-shadow: 0 0 10px var(--glow);
      flex-shrink: 0;
    }

    .tb-sep {
      width: 1px;
      height: 26px;
      background: var(--border);
      margin: 0 4px;
      flex-shrink: 0;
    }

    #taskbar-apps {
      display: flex;
      gap: 4px;
      flex: 1;
      overflow: hidden;
    }

    .tb-btn {
      font-family: 'Cinzel', serif;
      font-size: 0.68em;
      letter-spacing: 0.5px;
      background: var(--surface);
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 5px 12px;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tb-btn:hover {
      background: rgba(192,57,43,0.2);
      color: var(--text);
      border-color: rgba(192,57,43,0.4);
    }

    .tb-btn.is-focused {
      background: rgba(192,57,43,0.18);
      color: var(--text);
      border-color: rgba(192,57,43,0.5);
      box-shadow: inset 0 2px 0 rgba(192,57,43,0.3);
    }

    .tb-btn.is-minimized {
      opacity: 0.55;
    }

    .tb-btn .tb-icon { font-size: 1.2em; }

    #add-btn {
      margin-left: auto;
      font-family: 'Cinzel', serif;
      font-size: 0.68em;
      letter-spacing: 0.5px;
      background: transparent;
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.35);
      border-radius: 4px;
      padding: 5px 14px;
      cursor: pointer;
      transition: all 0.15s;
      text-transform: uppercase;
      flex-shrink: 0;
    }

    #add-btn:hover {
      background: rgba(201,168,76,0.12);
      border-color: var(--gold);
    }

    /* ══════════════════════════════════════
       MODAL — ADD APP
    ══════════════════════════════════════ */
    #modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    #modal-overlay.open {
      opacity: 1;
      pointer-events: all;
    }

    .modal {
      background: var(--panel);
      border: 1px solid var(--accent);
      border-radius: 8px;
      padding: 28px 32px;
      width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.8), 0 0 40px var(--glow);
      transform: translateY(6px);
      transition: transform 0.2s;
    }

    #modal-overlay.open .modal { transform: translateY(0); }

    .modal h3 {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      font-size: 1em;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .modal label {
      display: block;
      font-family: 'Cinzel', serif;
      font-size: 0.7em;
      letter-spacing: 1px;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 5px;
      margin-top: 14px;
    }

    .modal input {
      width: 100%;
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 9px 12px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1em;
      outline: none;
      transition: border-color 0.15s;
    }

    .modal input:focus { border-color: var(--accent); }

    .modal-hint {
      font-size: 0.82em;
      color: var(--text-dim);
      margin-top: 6px;
      font-style: italic;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 22px;
    }

    .modal-actions button {
      font-family: 'Cinzel', serif;
      font-size: 0.72em;
      letter-spacing: 1px;
      text-transform: uppercase;
      border-radius: 4px;
      padding: 8px 20px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-cancel {
      background: transparent;
      color: var(--text-dim);
      border: 1px solid var(--border);
    }

    .btn-cancel:hover { border-color: var(--text-dim); color: var(--text); }

    .btn-confirm {
      background: var(--accent);
      color: #fff;
      border: 1px solid var(--accent);
    }

    .btn-confirm:hover { filter: brightness(1.2); }

    /* ══════════════════════════════════════
       NOTIFICATION TOAST
    ══════════════════════════════════════ */
    #toast {
      position: fixed;
      bottom: calc(var(--taskbar-h) + 14px);
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'Cinzel', serif;
      font-size: 0.7em;
      letter-spacing: 1px;
      padding: 8px 18px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.25s, transform 0.25s;
      pointer-events: none;
      z-index: 99990;
      text-transform: uppercase;
    }

    #toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

<div id="desktop"></div>

<div id="taskbar">
  <div id="taskbar-apps"></div>
  <div class="tb-sep"></div>
  <button id="add-btn" onclick="openAddModal()">＋ Приложение</button>
</div>

<div id="modal-overlay">
  <div class="modal">
    <h3>Добавить приложение</h3>
    <label>Название</label>
    <input id="m-title" type="text" placeholder="Моё приложение" />
    <label>Значок</label>
    <input id="m-icon" type="text" placeholder="🧙" maxlength="4" />
    <label>Файл или URL</label>
    <input id="m-url" type="text" placeholder="myapp.html или https://..." />
    <p class="modal-hint">Файл должен находиться в той же папке, что и dnd_desktop.html</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeAddModal()">Отмена</button>
      <button class="btn-confirm" onclick="confirmAddApp()">Открыть</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
/* ════════════════════════════════════════════════════════════
   WINDOW MANAGER
════════════════════════════════════════════════════════════ */
const desktop   = document.getElementById('desktop');
const taskbarEl = document.getElementById('taskbar-apps');

let zBase    = 10;
let focusedId = null;
const winState = {};   // id → { el, minimized, maximized, savedGeom, app }

// Initial app definitions
const APPS = [
  {
    id:    'battletracker',
    title: 'Battle Tracker',
    icon:  '⚔️',
    url:   'battletracker.html',
    x: 28,  y: 20, w: 920, h: 620
  },
  {
    id:    'vivarium',
    title: 'Виварий',
    icon:  '🐉',
    url:   'Vivarium D&D.html',
    x: 80,  y: 55, w: 1060, h: 670
  },
  {
    id:    'npcgen',
    title: 'Генератор NPC',
    icon:  '🎲',
    url:   'index.html',
    x: 140, y: 90, w: 720, h: 640
  }
];

// ── Create a window ─────────────────────────────────────────
function createWindow(app) {
  const id  = app.id;
  const el  = document.createElement('div');
  el.className = 'app-window';
  el.id = `win-${id}`;
  el.style.cssText = `left:${app.x}px;top:${app.y}px;width:${app.w}px;height:${app.h}px;z-index:${++zBase}`;

  el.innerHTML = `
    <div class="win-titlebar" id="tb-${id}">
      <div class="win-dots">
        <button class="win-dot close"    title="Закрыть"    onclick="closeWin('${id}')"></button>
        <button class="win-dot minimize" title="Свернуть"   onclick="minimizeWin('${id}')"></button>
        <button class="win-dot maximize" title="Развернуть" onclick="maximizeWin('${id}')"></button>
      </div>
      <div class="win-title">${app.icon || ''} ${app.title}</div>
      <div style="width:42px;flex-shrink:0;"></div>
    </div>
    <div class="win-body">
      <iframe
        src="${app.url}"
        id="fr-${id}"
        sandbox="allow-scripts allow-same-origin allow-forms allow-modals allow-downloads allow-popups"
        loading="lazy"
        title="${app.title}"
      ></iframe>
      <div class="win-shield" id="sh-${id}"></div>
    </div>
    <div class="win-resize" id="rz-${id}"></div>
  `;

  desktop.appendChild(el);

  winState[id] = { el, minimized: false, maximized: false, savedGeom: null, app };

  // Events
  el.addEventListener('mousedown', () => focusWin(id));
  makeDraggable(el, document.getElementById(`tb-${id}`), id);
  makeResizable(el, document.getElementById(`rz-${id}`), id);
  addTaskbarBtn(app);
  focusWin(id);
}

// ── Taskbar button ──────────────────────────────────────────
function addTaskbarBtn(app) {
  const id  = app.id;
  const btn = document.createElement('button');
  btn.className = 'tb-btn is-focused';
  btn.id = `tbbtn-${id}`;
  btn.innerHTML = `<span class="tb-icon">${app.icon || '📄'}</span>${app.title}`;
  btn.onclick = () => handleTaskbarClick(id);
  taskbarEl.appendChild(btn);
}

function updateTaskbarBtn(id) {
  const btn = document.getElementById(`tbbtn-${id}`);
  if (!btn) return;
  const s = winState[id];
  btn.classList.toggle('is-focused',   !s.minimized && focusedId === id);
  btn.classList.toggle('is-minimized', s.minimized);
}

// ── Focus ───────────────────────────────────────────────────
function focusWin(id) {
  if (focusedId === id && !winState[id].minimized) return;
  Object.values(winState).forEach(s => s.el.classList.remove('focused'));
  winState[id].el.classList.add('focused');
  winState[id].el.style.zIndex = ++zBase;
  focusedId = id;
  Object.keys(winState).forEach(updateTaskbarBtn);
}

// ── Taskbar click ───────────────────────────────────────────
function handleTaskbarClick(id) {
  const s = winState[id];
  if (s.minimized) {
    restoreWin(id);
  } else if (focusedId === id) {
    minimizeWin(id);
  } else {
    focusWin(id);
  }
}

// ── Minimize / Restore ──────────────────────────────────────
function minimizeWin(id) {
  winState[id].el.classList.add('minimized');
  winState[id].minimized = true;
  if (focusedId === id) focusedId = null;
  updateTaskbarBtn(id);
}

function restoreWin(id) {
  winState[id].el.classList.remove('minimized');
  winState[id].minimized = false;
  focusWin(id);
}

// ── Maximize / Restore ──────────────────────────────────────
function maximizeWin(id) {
  const s  = winState[id];
  const el = s.el;
  if (s.maximized) {
    const g = s.savedGeom;
    el.style.left   = g.x + 'px';
    el.style.top    = g.y + 'px';
    el.style.width  = g.w + 'px';
    el.style.height = g.h + 'px';
    s.maximized = false;
  } else {
    s.savedGeom = { x: el.offsetLeft, y: el.offsetTop, w: el.offsetWidth, h: el.offsetHeight };
    el.style.left   = '0';
    el.style.top    = '0';
    el.style.width  = '100%';
    el.style.height = desktop.offsetHeight + 'px';
    s.maximized = true;
  }
  focusWin(id);
}

// ── Close ───────────────────────────────────────────────────
function closeWin(id) {
  winState[id].el.remove();
  document.getElementById(`tbbtn-${id}`)?.remove();
  if (focusedId === id) focusedId = null;
  delete winState[id];
}

// ── Drag ────────────────────────────────────────────────────
function makeDraggable(winEl, handle, id) {
  let active = false, ox, oy, sx, sy;

  handle.addEventListener('mousedown', e => {
    if (e.target.classList.contains('win-dot')) return;
    active = true;
    sx = e.clientX;
    sy = e.clientY;
    ox = winEl.offsetLeft;
    oy = winEl.offsetTop;
    // Shield iframes so mouse events reach the desktop
    document.querySelectorAll('.win-shield').forEach(sh => sh.style.display = 'block');
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!active) return;
    const nx = ox + e.clientX - sx;
    const ny = oy + e.clientY - sy;
    const maxX = window.innerWidth  - 60;
    const maxY = desktop.offsetHeight - 10;
    winEl.style.left = Math.max(-winEl.offsetWidth + 100, Math.min(nx, maxX)) + 'px';
    winEl.style.top  = Math.max(0, Math.min(ny, maxY)) + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!active) return;
    active = false;
    document.querySelectorAll('.win-shield').forEach(sh => sh.style.display = 'none');
  });
}

// ── Resize ──────────────────────────────────────────────────
function makeResizable(winEl, handle, id) {
  let active = false, sx, sy, sw, sh;

  handle.addEventListener('mousedown', e => {
    active = true;
    sx = e.clientX;
    sy = e.clientY;
    sw = winEl.offsetWidth;
    sh = winEl.offsetHeight;
    document.querySelectorAll('.win-shield').forEach(s => s.style.display = 'block');
    e.preventDefault();
    e.stopPropagation();
  });

  document.addEventListener('mousemove', e => {
    if (!active) return;
    const nw = Math.max(360, sw + e.clientX - sx);
    const nh = Math.max(240, sh + e.clientY - sy);
    winEl.style.width  = nw + 'px';
    winEl.style.height = nh + 'px';
  });

  document.addEventListener('mouseup', () => {
    if (!active) return;
    active = false;
    document.querySelectorAll('.win-shield').forEach(s => s.style.display = 'none');
  });
}

/* ════════════════════════════════════════════════════════════
   ADD-APP MODAL
════════════════════════════════════════════════════════════ */
let appCounter = 100;

function openAddModal() {
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('m-title').focus();
}

function closeAddModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  ['m-title','m-icon','m-url'].forEach(id => document.getElementById(id).value = '');
}

function confirmAddApp() {
  const title = document.getElementById('m-title').value.trim() || 'Приложение';
  const icon  = document.getElementById('m-icon').value.trim()  || '📄';
  const url   = document.getElementById('m-url').value.trim();
  if (!url) { showToast('Укажите URL или имя файла'); return; }

  const id  = 'custom_' + (++appCounter);
  const app = {
    id, title, icon, url,
    x: 60 + Math.random() * 120,
    y: 40 + Math.random() * 80,
    w: 860, h: 600
  };

  createWindow(app);
  closeAddModal();
  showToast(`Открыто: ${title}`);
}

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeAddModal();
});

// Enter key in modal
document.getElementById('modal-overlay').addEventListener('keydown', e => {
  if (e.key === 'Enter') confirmAddApp();
  if (e.key === 'Escape') closeAddModal();
});

/* ════════════════════════════════════════════════════════════
   TOAST
════════════════════════════════════════════════════════════ */
let toastTimer;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 2500);
}

/* ════════════════════════════════════════════════════════════
   BOOT — spawn initial windows with a slight cascade delay
════════════════════════════════════════════════════════════ */
(function boot() {
  APPS.forEach((app, i) => {
    setTimeout(() => createWindow(app), i * 80);
  });

  // After all windows created, focus the first one
  setTimeout(() => {
    if (APPS.length > 0) focusWin(APPS[0].id);
  }, APPS.length * 80 + 50);
})();
</script>

</body>
</html>
